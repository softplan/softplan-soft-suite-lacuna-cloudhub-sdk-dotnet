site_name: Lacuna Cloudhub .NET SDK
site_description: Strongly typed .NET SDK for the Lacuna Cloudhub API, maintained by Softplan.
site_url: https://softplan.github.io/softplan-soft-suite-lacuna-cloudhub-sdk-dotnet/
repo_url: https://github.com/softplan/softplan-soft-suite-lacuna-cloudhub-sdk-dotnet
repo_name: softplan/softplan-soft-suite-lacuna-cloudhub-sdk-dotnet
edit_uri: edit/main/docs/

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Guides:
      - Client configuration: guides/configuration.md
      - Release publishing: guides/release-publishing.md
# EXAMPLES:START
# EXAMPLES:END

theme:
  name: material
  language: en
  favicon: media/icon128.png
  logo: media/icon128.png
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
